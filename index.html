<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1c1614" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>RAMEN SHO POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Inter:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="kanji">昇</span><div><b>RAMEN SHO</b><small>POS</small></div></div>
    <div class="top-right"><span id="syncState" class="sync"></span><span id="clock" class="clock"></span></div>
  </header>

  <main id="app" class="app"></main>
  <div id="toast" class="toast"></div>

  <nav class="nav">
    <button data-view="home"><span>🏠</span>HOME</button>
    <button data-view="order"><span>🍜</span>ORDER<i class="badge-dot" data-order-badge hidden>0</i></button>
    <button data-view="stock"><span>📦</span>STOCK</button>
    <button data-view="expense"><span>🧾</span>BUY</button>
    <button data-view="report" class="owner-only"><span>📊</span>REPORT</button>
    <button data-view="history" class="owner-only"><span>🕘</span>HISTORY</button>
  </nav>

  <script src="config.js"></script>
  <script src="menu-default.js"></script>
  <script src="sheet-sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
