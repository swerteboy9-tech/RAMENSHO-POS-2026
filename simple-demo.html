<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMEN SHO — Simple Demo</title><style>
:root{--red:#bc332b;--ink:#262c29;--muted:#777e76;--bg:#f6f4ee;--line:#e5e6dd;--green:#397055}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;min-height:48px;border-radius:14px;padding:12px 18px;background:#fff;color:var(--ink);font-weight:650}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cf9839;outline-offset:3px}header{background:#fff;border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:13px}.seal{background:var(--red);color:#fff;font-size:28px;border-radius:12px;padding:4px 13px}.brand{letter-spacing:2px;font-weight:800}.tiny{font-size:12px;color:var(--muted)}.demo{margin-left:auto;border:1px solid #e7c88d;color:#986818;border-radius:30px;padding:5px 12px;font-size:12px}.shell{max-width:1100px;margin:auto;padding:24px 24px 110px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px}select,input{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:100%;min-height:48px}input[type=number]{width:150px}h1{font-size:30px;letter-spacing:-1px;margin:5px 0 10px}h2{font-size:20px;margin:0 0 16px}h3{margin:0 0 8px}p{line-height:1.75}small,.muted{color:var(--muted)}.eyebrow{color:var(--red);letter-spacing:2px;font-size:12px;font-weight:750}.card{padding:24px;border:1px solid var(--line);border-radius:22px;background:white;margin-bottom:18px}.hero{background:#233e32;color:white;border:0}.hero p,.hero small{color:#c4d4ca}.primary{background:var(--red);color:white}.green{background:var(--green);color:#fff}.soft{background:#f1f2eb}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{text-align:left;border:1px solid var(--line);padding:20px;min-height:120px}.emoji{display:block;font-size:32px;margin-bottom:10px}.price{display:block;color:var(--red);margin-top:8px}.tag{display:inline-block;padding:6px 10px;background:#f1f2eb;border-radius:8px;font-size:12px}.warn{background:#fff1d6;color:#946019}.ok{background:#e6f2e9;color:#397055}.metric{font-size:34px;font-weight:750}.line{padding:14px 0;border-bottom:1px solid var(--line)}.progress{height:7px;background:#e7ebe4;border-radius:8px;margin:16px 0}.progress span{display:block;height:100%;background:var(--green);border-radius:8px}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;padding:7px;gap:5px;border:1px solid var(--line);background:#fffffff5;box-shadow:0 8px 40px #22332415;border-radius:20px;z-index:5}nav button{white-space:nowrap;background:none}nav .active{background:var(--ink);color:#fff}.stack{display:grid;gap:12px}.count{max-width:580px;margin:auto;text-align:center}.count input{font-size:36px;width:210px;text-align:center;margin:22px 0}.notice{padding:14px 18px;border-radius:12px;background:#f9ebce;font-size:13px;line-height:1.7;margin-bottom:20px}.success{color:var(--green)}.table{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}details{margin:18px 0}summary{cursor:pointer;padding:12px 0}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#233e32;color:white;padding:15px 24px;border-radius:14px;z-index:10;display:none;max-width:90vw}.bigaction{width:100%;min-height:115px;text-align:left;background:var(--red);color:#fff;font-size:24px}.bigaction small{display:block;font-size:13px;color:#ffdfd9;margin-top:8px}.split{display:flex;gap:8px;flex-wrap:wrap}.selected{background:#233e32;color:white}.label{display:block;margin:15px 0 7px;font-size:14px;font-weight:650}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:700px){.shell{padding:18px 16px 110px}header{padding:14px 16px}.grid{grid-template-columns:1fr}.card{padding:20px}h1{font-size:26px}nav{bottom:8px;width:calc(100% - 20px);justify-content:space-around}nav button{font-size:12px;padding:10px;min-width:0}.toolbar{gap:6px}.toolbar select{max-width:145px}.tiles{gap:8px}.tile{padding:15px}.demo{font-size:10px}.metric{font-size:30px}}
</style></head><body><header><span class="seal">昇</span><div><div class="brand">RAMEN SHO</div><div class="tiny">小さな操作で、お店がまわる。</div></div><span class="demo">操作体験 DEMO</span></header><div class="shell"><div class="toolbar"><select aria-label="画面の役割" id="role"><option value="staff">スタッフ画面</option><option value="owner">社長画面</option></select><select aria-label="デモシフト" id="shift"><option value="night">夜番を体験</option><option value="day">翌日の昼番を体験</option></select><span class="tiny" id="clock"></span></div><main id="app"></main><details><summary class="tiny">デモについて・最初からやり直す</summary><p class="tiny">架空の数量・単価を使った操作デモです。このブラウザだけに保存され、実際のPOS・Google Sheets・通知・送金には接続しません。画面切替は権限認証ではありません。市場の仕入れは受取時に記録。生肉は社長宅の材料として扱います。</p><button id="reset" class="soft">デモデータをリセット</button></details></div><nav id="nav"></nav><div id="toast" role="status"></div>
<script>
const KEY='ramensho-simple-demo-v1';
const menu=[['豚骨ラーメン',199,'🍜',1,0],['担々麺',210,'🌶️',0,1],['豚骨 × 担々麺',285,'🍜',1,1],['豚骨 × 豚骨',280,'🍜',2,0],['担々麺 × 担々麺',290,'🌶️',0,2],['チャーシューメン',299,'🥩',1,0],['唐揚げ丼',180,'🍚',0,0],['唐揚げ 5個',150,'🍗',0,0],['ロイヤル',60,'🥤',0,0]];
const items=[['白麺','玉',40,'owner'],['黄色麺','玉',30,'owner'],['豚骨ベース','g',1000,'owner'],['担々ベース','g',1000,'owner'],['卵','個',30,'market'],['青ネギ','g',300,'market'],['豚ばら肉','kg',3,'market'],['鶏肉','kg',3,'market']];
const unitPrices={4:8.5,5:.7,6:500,7:300};
function initial(){return{stock:[14,24,800,600,10,100,1,1],home:[140,110,4000,4000],raw:{},orders:[],events:[],attendance:[],checked:false,checkStart:null,closed:false,closeReport:null,request:null,shopping:null,receivedCash:null,purchased:false,returned:false,actualCost:0,actualQty:{},prepared:0,safe:0,shift:'night',role:'staff',prepDone:false}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){s=initial()}
let page='home',cart=[],payment='cash',takeout=false,countStep=0,countDraft=[],countMode='count';
const $=id=>document.getElementById(id),money=n=>'₱'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){toast('保存できません。この画面を閉じると記録が失われます。')}}
function log(t){s.events.unshift({time:new Date().toISOString(),text:t});persist()}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}
function go(p){page=p;render();window.scrollTo(0,0)}
function sales(sh=s.shift,pay){return s.orders.filter(o=>o.shift===sh&&(!pay||o.payment===pay)).reduce((a,o)=>a+o.total,0)}
function cashExpected(){return 2000+sales('night','cash')}
function needs(route){return items.map((it,i)=>({i,name:it[0],unit:it[1],qty:Math.max(0,it[2]-s.stock[i])})).filter(x=>items[x.i][3]===route&&x.qty>0)}
function cost(list){return list.reduce((a,x)=>a+x.qty*(unitPrices[x.i]||0),0)}
function lines(list){return list.map(x=>'<div class="line row"><div>'+x.name+' <small>'+x.qty+' '+x.unit+'</small></div><span>'+ (unitPrices[x.i]?money(x.qty*unitPrices[x.i]):'社長宅から')+'</span></div>').join('')}
function btn(t,fn,cls='primary'){return '<button class="'+cls+'" onclick="'+fn+'">'+t+'</button>'}
function head(k,t,p){return '<div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+p+'</p>'}
function render(){
$('role').value=s.role;$('shift').value=s.shift;
$('clock').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())+' · PH';
$('nav').innerHTML=[['home','⌂ ホーム'],['order','🍜 注文'],['tasks','✓ 準備'],['sales','▥ 売上']].map(([p,n])=>btn(n,"go('"+p+"')",page===p?'active':'')).join('');
if(s.role==='owner'){owner();return}
({home,order,tasks,sales:report,count:countView,closing:closeView,purchase:purchaseView,waste:wasteView}[page]||home)();
}
function home(){
let next=s.shift==='night'?(s.closed?'翌朝の準備ができました':'閉店前に、在庫を数えましょう'):(s.shopping?(s.returned?'買い出し完了。営業の準備へ':s.purchased?'お釣りを金庫へ戻しましょう':s.receivedCash!==null?'買い物リストの準備ができています':'買い出し資金を受け取りましょう'):'夜番の引継ぎを待っています');
$('app').innerHTML=head('YOUR SHIFT',s.shift==='night'?'夜番、おつかれさまです。':'昼番、おはようございます。','今日やることを、一つずつ。')+
'<div class="card row"><div><span class="tag '+(s.checked?'ok':'')+'">'+(s.checked?'勤務中':'未チェックイン')+'</span><div class="tiny" style="margin-top:8px">デモスタッフ · '+(s.shift==='night'?'夜番':'昼番')+'</div></div>'+btn(s.checked?'チェックアウト':'チェックイン','attendance()',s.checked?'soft':'green')+'</div>'+
'<div class="grid"><div>'+btn('🍜 注文する <small>商品をタップして、かんたん会計 →</small>',"go('order')",'bigaction')+'<div class="card" style="margin-top:18px"><div class="row"><h2>いま、やること</h2><span class="tag">NEXT</span></div><h3>'+next+'</h3><p class="muted">在庫確認から引継ぎまで、この画面で案内します。</p>'+btn(s.shift==='night'?(s.closed?'引継ぎを見る':'在庫を数える'):'買い出しを見る',s.shift==='night'&&!s.closed?"startCount('close')":"go('tasks')",'green wide')+'</div></div><div><div class="card hero"><small>このシフトの売上〈デモ〉</small><div class="metric">'+money(sales())+'</div><p>現金 '+money(sales(s.shift,'cash'))+' ／ GCash '+money(sales(s.shift,'gcash'))+'</p>'+btn('詳細を見る',"go('sales')",'wide')+'</div><div class="card"><h3>準備の進捗</h3><div class="progress"><span style="width:'+(s.shift==='night'?(s.closed?100:0):(s.returned?100:s.purchased?75:s.receivedCash!==null?40:0))+'%"></span></div><small>正しく記録することが、今日のゴール。</small></div></div></div>'+
'<details><summary>勤怠の記録を見る</summary>'+s.attendance.map(a=>'<div class="line">'+esc(a)+'</div>').join('')+'</details>';
}
function attendance(){if(s.checked&&s.shift==='night'&&!s.closed){toast('先に閉店チェックを完了してください');startCount('close');return}s.checked=!s.checked;s.checkStart=s.checked?new Date().toISOString():null;let t=(s.shift==='night'?'夜番':'昼番')+' '+(s.checked?'チェックイン':'チェックアウト')+' '+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Manila'});s.attendance.unshift(t);log(t);render()}
function total(){return cart.reduce((a,x)=>a+menu[x.i][1]*x.q,0)+(takeout?cart.reduce((a,x)=>a+(menu[x.i][3]+menu[x.i][4])*x.q*15+(x.i===6||x.i===7?x.q*10:0),0):0)}
function add(i){let x=cart.find(x=>x.i===i);if(x)x.q++;else cart.push({i,q:1});render()}
function order(){$('app').innerHTML=head('TAKE AN ORDER','今日は何にしますか？','タップで追加。会計までは在庫は変わりません。')+'<div class="grid"><div class="tiles">'+menu.map((m,i)=>btn('<span class="emoji">'+m[2]+'</span>'+m[0]+'<span class="price">'+money(m[1])+'</span>','add('+i+')','tile')).join('')+'</div><div class="card"><h2>いまの注文</h2>'+(cart.length?cart.map((x,j)=>'<div class="line row"><div>'+menu[x.i][0]+'<br><small>'+money(menu[x.i][1])+' × '+x.q+'</small></div>'+btn('−',"cart["+j+"].q--;cart=cart.filter(x=>x.q>0);render()",'soft')+'</div>').join(''):'<div class="empty">← 商品を選んでください</div>')+'<span class="label">受取方法</span><div class="split">'+btn('店内','takeout=false;render()',!takeout?'selected':'soft')+btn('持ち帰り','takeout=true;render()',takeout?'selected':'soft')+'</div><small>容器代：麺1杯 ₱15／丼・サイド1点 ₱10</small><span class="label">支払い方法</span><div class="split">'+btn('現金',"payment='cash';render()",payment==='cash'?'selected':'soft')+btn('GCash',"payment='gcash';render()",payment==='gcash'?'selected':'soft')+'</div><p class="row">合計<strong class="metric">'+money(total())+'</strong></p><button class="primary wide" onclick="checkout()" '+(!cart.length?'disabled':'')+'>支払確認・注文を確定</button><p class="tiny">デモは会計確定で麺を減算します。GCashの実入金確認は接続していません。</p></div></div>'}
function checkout(){if(!cart.length)return;if(!s.checked){toast('ホームでチェックインしてください');return}if(s.shift==='night'&&s.closed){toast('夜番は締め済みです。翌日の昼番へ切り替えてください');return}let w=cart.reduce((a,x)=>a+menu[x.i][3]*x.q,0),y=cart.reduce((a,x)=>a+menu[x.i][4]*x.q,0);if(w>s.stock[0]||y>s.stock[1]){toast('麺の在庫が足りません。補充を確認してください');return}s.stock[0]-=w;s.stock[1]-=y;s.orders.push({id:crypto.randomUUID(),shift:s.shift,payment,takeout,total:total(),cart:structuredClone(cart)});log('注文確定 '+money(total())+' / '+payment);cart=[];toast('注文完了！ 麺の在庫も更新しました');go('home')}
function startCount(mode){countMode=mode;countStep=0;countDraft=[];go('count')}
function countView(){let i=countStep;let max=countMode==='close'?items.length:2;$('app').innerHTML='<div class="count">'+head('COUNT STOCK','実際に数えて、入力。','予定残数は入力後に比較します。')+'<div class="card"><div class="row"><span class="tag">在庫チェック</span><small>'+(i+1)+' / '+max+'</small></div><div class="progress"><span style="width:'+i/max*100+'%"></span></div><span class="emoji">'+(i<2?'🍜':i<4?'🥣':'🛒')+'</span><h2>'+items[i][0]+'は、いくつ残っていますか？</h2><label><input id="countvalue" type="number" min="0" step="'+(i>5?'.1':'1')+'" inputmode="decimal" value="'+(countDraft[i]??'')+'" aria-label="実際の在庫数量"> '+items[i][1]+'</label><p class="tiny">'+(i===6||i===7?'社長宅の生肉は、共有済みの数量を確認する想定です。':'残っている実物の数を入力してください。')+'</p><div class="split">'+(i?btn('戻る','countStep--;render()','soft'):'')+btn(i===max-1?'入力を確認する':'次へ','nextCount()','green')+'</div></div></div>'}
function nextCount(){let el=$('countvalue');let v=Number(el.value);if(el.value===''||!Number.isFinite(v)||v<0||((countStep<6)&&!Number.isInteger(v))){toast('0以上の数量を正しく入力してください');return}countDraft[countStep]=v;let max=countMode==='close'?8:2;if(++countStep<max)render();else{let diff=countDraft.map((v,i)=>items[i][0]+': 予定 '+s.stock[i]+' → 実数 '+v);s.closeReport=diff;countDraft.forEach((v,i)=>s.stock[i]=v);log('棚卸：'+diff.join(' / '));if(countMode==='close')go('closing');else{toast('実数と差を記録しました');go('tasks')}}}
function closeView(){let list=needs('market'),budget=Math.ceil(cost(list)/100)*100;$('app').innerHTML=head('FINISH YOUR SHIFT','翌朝の準備まで、あと一歩。','買い物リストと予算は、在庫から自動計算しました。')+'<div class="grid"><div class="card"><h2>明日の市場リスト</h2>'+lines(list)+'<p class="row">予定仕入れ額<strong>'+money(cost(list))+'</strong></p><small>単価・必要数はデモ用の仮設定です。生肉は社長宅、卵・青ネギは店舗へ。</small></div><div class="card"><h2>現金を数えて、資金を分ける</h2><label class="label" for="actualcash">いまレジにある現金</label><input id="actualcash" type="number" min="0" placeholder="実際の金額"><label class="label" for="budget">金庫に残す買い出し資金</label><input id="budget" type="number" min="0" value="'+budget+'"><p class="tiny">目安 '+money(budget)+'。金庫への移動は経費ではありません。</p><label class="label" for="reason">現金差・予算不足がある場合の引継ぎ</label><input id="reason" placeholder="例：不足分は社長へ依頼"><p>'+btn('閉店・引継ぎをまとめて完了','finishClose()','green wide')+'</p></div></div><details><summary>在庫の照合結果</summary>'+(s.closeReport||[]).map(x=>'<div class="line">'+esc(x)+'</div>').join('')+'</details>'}
function finishClose(){if(s.closed)return;let a=$('actualcash').value,b=$('budget').value,r=$('reason').value.trim();if(a===''||b===''||!Number.isFinite(+a)||!Number.isFinite(+b)||+a<0||+b<0||+b>+a){toast('現金と予算を確認してください。予算は実際の現金以下にします');return}let list=needs('market');if((+a!==cashExpected()||+b<cost(list))&&!r){toast('予定現金との差 '+money(+a-cashExpected())+' または予算不足があります。理由を入力してください');return}s.shopping=list;s.prepared=+b;s.safe=+b;s.request=needs('owner');s.closed=true;s.cashDiff=+a-cashExpected();s.handover=r;log('夜番締め：現金差 '+money(s.cashDiff)+' / 金庫 '+money(+b)+' / 引継ぎ '+r);toast('翌朝への引継ぎができました');go('home')}
function tasks(){let list=s.shopping||needs('market');$('app').innerHTML=head('TODAY’S TASKS','今日やること','必要な作業だけ、まとめて。')+'<div class="grid"><div><div class="card"><span class="tag warn">市場で買う</span><h2 style="margin-top:14px">'+(s.shopping?'引継ぎ済みの買い物':'買い出し候補')+'</h2>'+lines(list)+(s.shopping?'<p>金庫に準備：<strong>'+money(s.prepared)+'</strong></p>':'<p class="muted">夜番の閉店チェックで確定します。</p>')+(s.shopping&&!s.returned?(s.receivedCash===null?'<label class="label">金庫から実際に受け取る金額</label><input id="receivecash" type="number" min="0"><p>'+btn('資金を受け取る','receiveCash()','green wide')+'</p>':s.purchased?'<p>返すお釣り：<strong>'+money(s.receivedCash-s.actualCost)+'</strong></p>'+btn('金庫にお釣りを返した','returnCash()','green wide'):btn('買い物リストを開く',"go('purchase')",'green wide')):s.returned?'<span class="tag ok">✓ 買い出し・精算完了</span>':'')+'</div></div><div><div class="card"><span class="tag">社長にお願い</span><h2 style="margin-top:14px">麺・スープの補充</h2>'+lines(s.request||needs('owner'))+(s.request?btn('数量を確認して受取','receiveStock()','green wide'):btn('まとめて依頼する','s.request=needs("owner");log("社長へ補充依頼");render()','soft wide'))+'<p class="tiny">デモ内での依頼です。通知は送信されません。受取は依頼数どおりの体験です。</p></div><div class="card"><h2>店舗で仕込む</h2><p>煮卵：卵10個を使って10個完成〈体験〉</p>'+btn(s.prepDone?'✓ 仕込み記録済み':'仕込み完了を記録','prep()','soft wide')+'</div><div class="split">'+btn('麺の実数を入力',"startCount('count')",'soft')+btn('ロス・まかない',"go('waste')",'soft')+'</div></div></div>'}
function receiveCash(){if(s.receivedCash!==null)return;let v=$('receivecash').value;if(v===''||+v!==s.prepared){toast('準備額と一致しません。金庫の実物を確認してください');return}s.receivedCash=+v;s.safe-=+v;log('昼番が買い出し資金 '+money(+v)+' を受取');render()}
function purchaseView(){$('app').innerHTML=head('MARKET RUN','買った分だけ、確認。','数量・金額が予定と違った項目だけ修正してください。')+'<div class="card">'+s.shopping.map(x=>'<div class="line row"><label for="qty'+x.i+'">'+x.name+'<br><small>'+((x.i===6||x.i===7)?'届け先：社長宅':'届け先：店舗')+'</small></label><div><input id="qty'+x.i+'" type="number" min="0" step=".1" value="'+x.qty+'"> '+x.unit+'</div></div>').join('')+'<label class="label">実際に支払った合計金額</label><input id="paid" type="number" min="0" value="'+cost(s.shopping)+'"><p class="tiny">受取資金 '+money(s.receivedCash)+'。レシート保存は本実装で接続予定。</p>'+btn('購入内容を記録','purchase()','green wide')+'</div>'}
function purchase(){if(s.purchased)return;let v=$('paid').value,qty={};if(v===''||!Number.isFinite(+v)||+v<0||+v>s.receivedCash){toast('支払額は受取資金の範囲で入力してください');return}for(let x of s.shopping){let e=$('qty'+x.i);if(e.value===''||!Number.isFinite(+e.value)||+e.value<0){toast('購入数量を確認してください');return}qty[x.i]=+e.value}s.actualCost=+v;s.actualQty=qty;for(let i in qty)s.stock[+i]+=qty[i];s.purchased=true;log('市場購入 '+money(+v)+' / 生肉は社長宅、卵と青ネギは店舗へ');go('tasks')}
function returnCash(){if(!s.purchased||s.returned)return;s.safe+=s.receivedCash-s.actualCost;s.returned=true;log('お釣り返却 '+money(s.receivedCash-s.actualCost));toast('買い出しミッション完了！');render()}
function receiveStock(){if(!s.request)return;for(let x of s.request){if(s.home[x.i]<x.qty){toast('社長宅の在庫が不足しています');return}}for(let x of s.request){s.home[x.i]-=x.qty;s.stock[x.i]+=x.qty}s.request=null;log('社長から麺・スープを受取');toast('店舗の在庫を更新しました');render()}
function prep(){if(s.prepDone)return;if(s.stock[4]<10){toast('卵が10個必要です');return}s.stock[4]-=10;s.prepDone=true;log('煮卵10個完成・生卵10個使用');render()}
function wasteView(){$('app').innerHTML=head('RECORD HONESTLY','ロス・まかない','記録することが大切。ロスの数で採点しません。')+'<div class="card"><label class="label">麺の種類</label><select id="wi"><option value="0">白麺</option><option value="1">黄色麺</option></select><label class="label">数量</label><input id="wq" type="number" min="1" step="1" value="1"><label class="label">理由</label><select id="wr"><option>まかない</option><option>調理ミス</option><option>廃棄</option></select><p>'+btn('記録する','waste()','green')+'</p></div>'}
function waste(){let i=+$('wi').value,q=+$('wq').value;if(!Number.isInteger(q)||q<=0||q>s.stock[i]){toast('在庫内の玉数を入力してください');return}s.stock[i]-=q;log($('wr').value+'：'+items[i][0]+' '+q+'玉');toast('記録しました');go('tasks')}
function report(){$('app').innerHTML=head('SHIFT REPORT','昼と夜の売上','架空の注文のみ。集計は自動です。')+['day','night'].map(sh=>'<div class="card"><div class="row"><h2>'+ (sh==='day'?'昼番':'夜番')+'</h2><strong class="metric">'+money(sales(sh))+'</strong></div><p>現金 '+money(sales(sh,'cash'))+' ／ GCash '+money(sales(sh,'gcash'))+'</p><div class="table"><table><tr><th>商品</th><th>数量</th><th>商品売上</th></tr>'+menu.map((m,i)=>{let q=s.orders.filter(o=>o.shift===sh).reduce((a,o)=>a+o.cart.filter(x=>x.i===i).reduce((b,x)=>b+x.q,0),0);return q?'<tr><td>'+m[0]+'</td><td>'+q+'</td><td>'+money(q*m[1])+'</td></tr>':''}).join('')+'</table></div><p class="tiny">合計には持ち帰り容器代を含みます。</p></div>').join('')+'<div class="card"><h2>買い出しのお金</h2><p>準備 '+money(s.prepared)+' ／ 実支出 '+money(s.actualCost)+' ／ 金庫の買い出し資金残 '+money(s.safe)+'</p><small>金庫への移動・資金受取・返却は売上や経費に二重計上しません。</small></div>'}
function owner(){$('app').innerHTML=head('OWNER DESK','社長の確認ボード','スタッフは目の前の作業。社長は全体を確認。')+'<div class="notice">デモの役割切替です。本番の認証・通知・複数端末共有は未接続です。</div><div class="grid"><div class="card"><h2>店舗への補充依頼</h2>'+(s.request?.length?lines(s.request):'<p class="muted">現在、依頼はありません。</p>')+'<h3 style="margin-top:24px">社長宅で仕込むもの</h3><p>チャーシュー・鶏肉・カエシ・甘ダレ</p><small>仕込み量・納品日の設定は本実装で追加予定。</small></div><div class="card"><h2>買い出しの引継ぎ</h2><p>予定購入額 '+money(cost(s.shopping||needs('market')))+'</p><p>準備資金 '+money(s.prepared)+' ／ 実支出 '+money(s.actualCost)+'</p><p>夜番の現金差 '+money(s.cashDiff||0)+'</p><p>'+esc(s.handover||'引継ぎメモなし')+'</p><span class="tag '+(s.returned?'ok':'warn')+'">'+(s.returned?'精算完了':s.closed?'昼番へ引継ぎ済み':'夜番チェック待ち')+'</span></div></div><div class="card"><h2>在庫と残数</h2><div class="table"><table><tr><th>食材</th><th>現在</th><th>場所</th><th>補充目標〈仮〉</th></tr>'+items.map((it,i)=>'<tr><td>'+it[0]+'</td><td>'+s.stock[i]+' '+it[1]+'</td><td>'+(i>5?'社長宅・生肉':'店舗')+'</td><td>'+it[2]+' '+it[1]+'</td></tr>').join('')+'</table></div></div><div class="card"><h2>記録の履歴</h2>'+(s.events.length?s.events.map(e=>'<div class="line"><small>'+new Date(e.time).toLocaleString('ja-JP',{timeZone:'Asia/Manila'})+'</small><br>'+esc(e.text)+'</div>').join(''):'<p class="muted">操作するとここに記録が残ります。</p>')+'</div>'}
$('role').onchange=e=>{s.role=e.target.value;persist();go('home')};$('shift').onchange=e=>{s.shift=e.target.value;s.checked=false;persist();go('home')};$('reset').onclick=()=>{if(confirm('このデモの操作記録だけをリセットしますか？')){s=initial();cart=[];persist();go('home')}};render();
</script></body></html>
